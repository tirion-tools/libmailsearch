# libmailsearch: the search rules (mailsearch-core) and the reader with its C ABI (mailsearch,
# cdylib libmailsearch.so). The C++ query language is in cpp/ (CMake); the fuzz harness in fuzz/.
[workspace]
resolver = "3"
members = ["core", "reader"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[workspace.dependencies]
mailsearch-core = { path = "core" }
# The exact Tantivy version is part of the index VERSION stamp (core/src/lib.rs); consumers keep `=`.
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
# Tantivy's stemmer build (its `stemmer` feature), same version and these languages a subset of its set
frostem = { version = "=1.20260821.8", default-features = false, features = ["danish", "dutch", "english", "finnish", "french", "german", "greek", "hungarian", "italian", "norwegian", "portuguese", "romanian", "russian", "spanish", "swedish", "turkish"] }
unicode-normalization = "0.1"
memmap2 = "0.9"
stable_deref_trait = "1"
libc = "0.2"
# Tantivy's footer checksum (core/src/integrity.rs); the version Tantivy itself uses.
crc32fast = "1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "abort"
codegen-units = 1

# The C ABI catches every unwind (reader/src/lib.rs), which needs panic = "unwind": build the
# shared library with `--profile ffi`. Consumers that build it need the same profile.
[profile.ffi]
inherits = "release"
panic = "unwind"
